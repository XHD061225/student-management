spring.application.name=student-management

# File-backed H2 database: data remains in the project directory between restarts.
spring.datasource.url=jdbc:h2:file:./data/student-management;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

# Development-only H2 console. Do not expose this endpoint on a public server.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
